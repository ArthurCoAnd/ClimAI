<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <!-- fundo -->
    <rect width="512" height="512" fill="#f3ead7"/>

    <!-- manchas de tinta -->
    <g filter="url(#rough2)">
      <rect x="-20" y="-20" width="300" height="250" fill="#ff7a59"/>
      <rect x="250" y="300" width="290" height="240" fill="#23395b"/>
      <rect x="-20" y="380" width="230" height="160" fill="#8fb8a8"/>
    </g>

    <!-- sol -->
    <g filter="url(#rough)">
      <circle cx="170" cy="170" r="78" fill="#ffd23f"/>
      <circle cx="170" cy="170" r="78" fill="none" stroke="#1b1b1b" stroke-width="9"/>
      <g stroke="#1b1b1b" stroke-width="10" stroke-linecap="round">
        <path d="M170 50 L172 22"/>
        <path d="M252 84 L274 62"/>
        <path d="M88 86 L64 60"/>
        <path d="M50 172 L22 176"/>
        <path d="M86 256 L62 280"/>
        <path d="M292 160 L318 156"/>
      </g>
      <!-- espiral no sol -->
      <path d="M170 170 c10 -12 28 -2 24 14 c-4 20 -34 22 -44 4 c-12 -24 10 -50 38 -46" fill="none" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- nuvem -->
    <g filter="url(#rough)">
      <path d="M150 330 c-44 0 -62 -52 -22 -72 c-6 -52 62 -70 86 -30 c26 -44 104 -22 96 34 c52 2 58 68 6 68 z" fill="#ffffff" stroke="#1b1b1b" stroke-width="10" stroke-linejoin="round"/>
      <!-- hachuras na nuvem -->
      <g stroke="#1b1b1b" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <path d="M170 300 l14 -22"/>
        <path d="M196 304 l14 -24"/>
        <path d="M222 304 l14 -24"/>
        <path d="M248 304 l14 -24"/>
      </g>
    </g>

    <!-- chuva -->
    <g filter="url(#rough)" stroke-linecap="round" stroke-width="11">
      <path d="M170 366 L152 420" stroke="#23395b"/>
      <path d="M226 366 L206 440" stroke="#ff7a59"/>
      <path d="M282 366 L264 424" stroke="#ffffff"/>
      <path d="M338 366 L318 446" stroke="#ffd23f"/>
    </g>

    <!-- raio -->
    <g filter="url(#rough)">
      <path d="M398 150 L360 214 L392 214 L368 270 L432 196 L400 196 L424 150 Z" fill="#ffd23f" stroke="#1b1b1b" stroke-width="8" stroke-linejoin="round"/>
    </g>

    <!-- garatujas -->
    <g filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 440 l18 -20 l18 20 l18 -20 l18 20 l18 -20 l18 20"/>
      <path d="M40 468 l18 -20 l18 20 l18 -20 l18 20 l18 -20 l18 20"/>
      <path d="M400 60 h70 M400 78 h70 M400 96 h70" />
    </g>
    <g filter="url(#rough)" fill="none" stroke="#f3ead7" stroke-width="6" stroke-linecap="round">
      <path d="M420 470 c-10 -20 20 -30 26 -10 c6 22 -30 30 -40 8 c-12 -28 22 -52 52 -38"/>
    </g>
  </g>
</svg>
